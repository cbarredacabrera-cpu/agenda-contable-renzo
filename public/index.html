<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenda contable · Renzo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5ef;color:#203a33;font:15px/1.5 system-ui,sans-serif}header{background:#143d34;color:white;padding:16px max(5vw,20px);display:flex;align-items:center;justify-content:space-between;gap:15px}header strong{letter-spacing:.04em}.logo{display:inline-grid;place-items:center;background:#d6ebaa;color:#163e34;border-radius:8px;width:34px;height:34px;margin-right:10px;font:bold 23px Georgia}button,select,input,textarea{font:inherit;color:inherit}button,select{cursor:pointer}button,select,input,textarea{border:1px solid #cbd4c9;background:white;border-radius:8px;padding:8px 12px}button:hover{background:#edf3e6}button:focus-visible,select:focus-visible{outline:3px solid #91ad45}header select{color:#193e35}.wrap{max-width:1250px;margin:auto;padding:32px clamp(16px,4vw,54px)}.hero,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:11px;font-weight:750;letter-spacing:.15em;text-transform:uppercase;color:#5b7367}h1,h2,h3,p{margin:0}h1,h2{font-family:Georgia,serif;font-weight:normal}h1{font-size:clamp(40px,5vw,61px);line-height:1.12;letter-spacing:-.045em;margin:8px 0}h2{font-size:29px}.muted,small{color:#586e64}.primary{background:#1e5344;color:white;border-color:#1e5344;font-weight:600}.primary:hover{background:#2f6755}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.stat,.panel{background:#fff;border:1px solid #d6ded3;border-radius:15px}.stat{padding:12px 19px;display:flex;align-items:center;gap:15px}.stat strong{font:32px Georgia}.stat:first-child{background:#e6efd8}.layout{display:grid;grid-template-columns:minmax(265px,.92fr) minmax(0,2fr);gap:18px;align-items:start}.panel{padding:22px}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;margin-top:14px}.grid small{font-size:11px}.grid button{position:relative;border:0;padding:8px 0}.grid .selected{background:#225440;color:white}.dot:after{content:"";position:absolute;bottom:3px;left:calc(50% - 2px);height:4px;width:4px;background:#88af44;border-radius:100%}.nav{display:flex;gap:4px}.nav button{padding:3px 9px}.legend{font-size:12px;color:#607469;margin:12px 0 20px}.legend b{color:#779939}hr{border:0;border-top:1px solid #dfe5db;margin:18px 0}.full{width:100%}.day{font-size:clamp(23px,3vw,31px);text-transform:capitalize}.entry{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:18px 0;border-top:1px solid #e2e7df}.time{font-size:13px;font-variant-numeric:tabular-nums;color:#5c7068}.entry h3{font-size:17px;line-height:1.4;margin:5px 0}.entry p{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.entry h3{overflow-wrap:anywhere}.badge{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;background:#def0df;color:#285d40}.pending{background:#fff0ce;color:#785611}.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:#556a60}.edit{padding:2px 8px;font-size:12px}.list{margin-top:16px}.empty{padding:35px 0;color:#607469}footer{margin-top:22px;color:#5d7068;font-size:12px}dialog{border:0;border-radius:15px;padding:25px;width:min(470px,94vw);color:inherit}dialog::backdrop{background:#142d27aa}form label{display:block;margin:13px 0;font-weight:600;font-size:14px}form input,form select,textarea{display:block;width:100%;margin-top:4px}textarea{resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}#notice{color:#795014}
@media(max-width:760px){.layout{grid-template-columns:1fr}.wrap{padding-top:20px}.hero{align-items:flex-start;flex-wrap:wrap}.stat{padding:10px;gap:2px;align-items:flex-start;flex-direction:column;font-size:12px}.stats{gap:7px}.panel{padding:16px}header{padding:12px}header label{font-size:0}header select{font-size:14px}.entry{gap:5px}.grid button{padding:7px}.row{flex-wrap:wrap}}
[hidden]{display:none!important}#login{max-width:460px;margin:10vh auto;padding:32px}#login h1{font-size:44px}#sessionBar button{font-size:13px;margin-left:7px}#loginMsg{color:#8d3925;margin-top:10px}@media(max-width:500px){#login{margin:8vh 12px}} .grid .red-day,.holiday-note,.red-key{color:#a42332}.grid button.red-day{background:#fff1f1;font-weight:700}.grid button.red-day.selected{background:#a42332;color:white}.grid .red-day.selected.dot:after{background:#d6ebaa}.holiday-note{font-weight:600;margin-top:4px}

.share-eye::before{content:'';display:inline-block;width:14px;height:9px;margin-right:5px;border:1.5px solid currentColor;border-radius:70% 25%;transform:rotate(16deg);background:radial-gradient(circle,currentColor 0 2px,transparent 2.5px)}
.share-eye[aria-pressed=true]{background:#def0df}
.upcoming h2{font-size:25px}.upcoming-list{display:grid;gap:6px;max-height:360px;overflow:auto;margin-top:12px}
.upcoming-list button{display:grid;text-align:left;gap:3px;padding:10px 12px;background:#f4f7ef;overflow-wrap:anywhere}
.upcoming-list small{color:#456458}.upcoming-list strong{line-height:1.3}
@media(min-width:1060px){.layout{grid-template-columns:minmax(248px,.9fr) minmax(0,1.6fr) minmax(220px,.85fr)}}
@media(max-width:1059px){.upcoming{grid-column:1/-1;grid-row:1}.upcoming-list{max-height:205px}}
</style>
<header><strong><span class="logo" aria-hidden="true">≡</span>Contabilidad</strong><div id="sessionBar" hidden><b id="account"></b> <button id="logout">Salir</button></div></header>
<section id="login" class="panel"><div class="eyebrow">Equipo de Renzo</div><h1>Agenda contable</h1><p class="muted">Ingresa para consultar tu jornada.</p><form id="signin"><label>Usuario (DNI)<input id="user" autocomplete="username" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" required></label><label>Contraseña<input id="pass" type="password" autocomplete="current-password" required></label><button class="primary full">Ingresar</button><p id="loginMsg" role="status"></p></form></section>
<main class="wrap" id="app" hidden><div class="hero"><div><div class="eyebrow">Equipo de Renzo</div><h1>Agenda contable</h1><p class="muted" id="subtitle"></p></div><button class="primary" id="add">＋ Registrar actividad</button></div>
<div class="stats"><div class="stat"><strong id="total"></strong>Actividades del día</div><div class="stat"><strong id="done"></strong>Completadas</div><div class="stat"><strong id="pending"></strong>En proceso</div></div>
<div class="layout"><aside class="panel"><div class="eyebrow">Calendario</div><div class="row"><h3 id="month"></h3><div class="nav"><button id="prev" aria-label="Mes anterior">‹</button><button id="today">Hoy</button><button id="next" aria-label="Mes siguiente">›</button></div></div><div id="calendar" class="grid"></div><div class="legend"><b>●</b> Día con actividad · <span class="red-key">Domingos y feriados en rojo</span></div><hr><label for="filter" class="eyebrow">Responsable</label><select class="full" id="filter"><option value="">Todo el equipo</option><option>Renzo Salas</option><option>Fernando Paredes</option><option>Maricielo Quispe</option></select></aside>
<section class="panel"><div class="eyebrow">Registro diario</div><h2 class="day" id="day"></h2><p id="holiday" class="holiday-note" hidden></p><div id="list" class="list"></div></section><aside class="panel upcoming"><div class="eyebrow">Desde hoy</div><h2>Próximas actividades</h2><p class="muted" id="upCount"></p><div class="upcoming-list" id="upList"></div></aside></div><footer><button id="refresh">Actualizar agenda</button> <span id="sync" role="status"></span></footer><p id="notice" role="status"></p></main>
<dialog id="modal"><form id="form"><div class="eyebrow">Agenda contable</div><h2 id="heading"></h2><label>Responsable<select id="person"><option>Renzo Salas</option><option>Fernando Paredes</option><option>Maricielo Quispe</option></select></label><label>Fecha de actividad<input type="date" id="dateInput" required></label><label>Actividad<input id="titleInput" required maxlength="140" placeholder="Ej. Conciliación de la cuenta corriente"></label><label>Detalle del avance<textarea id="detail" rows="3" maxlength="1600" required placeholder="¿Qué realizaste y qué quedó pendiente?"></textarea></label><label>Estado<select id="statusInput"><option>En proceso</option><option>Completada</option></select></label><label id="shareLabel">Visibilidad<select id="share"><option value="restricted">Renzo y el responsable</option><option value="team">Compartida con todo el equipo</option></select></label><small id="hint"></small><div class="actions"><button type="button" id="cancel">Cancelar</button><button class="primary">Guardar actividad</button></div></form></dialog>
<script>
'use strict';
const el=id=>document.getElementById(id), fmt=(d,opts)=>d.toLocaleDateString('es-PE',opts);
const key=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const parse=s=>new Date(s+'T12:00:00'), limaDay=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Lima'}).format(new Date());
let selected=limaDay(), editing=null, revision=null, records=[],name='',loadNumber=0;
function showLogin(){++loadNumber;name='';records=[];el('app').hidden=true;el('sessionBar').hidden=true;el('login').hidden=false;if(el('modal').open)el('modal').close();el('list').replaceChildren()}
async function api(method,body){const r=await fetch('/api/agenda',{method,cache:'no-store',headers:{'Content-Type':'application/json','X-Agenda':'1'},body:body?JSON.stringify(body):undefined});const data=await r.json().catch(()=>({message:'La función de Vercel no está disponible. Publica la carpeta completa.'}));if(!r.ok||data.message){if(r.status===401)showLogin();throw Error(data.message||'No se pudo completar la operación.')}return data}
async function reload(){const n=++loadNumber;const data=await api('GET');if(n!==loadNumber)return;name=data.name;records=data.records;el('account').textContent=name;el('login').hidden=true;el('app').hidden=false;el('sessionBar').hidden=false;render();el('sync').textContent='Actualizado a las '+new Date().toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'})}
function report(e){el(el('app').hidden?'loginMsg':'notice').textContent=e.message}
el('signin').onsubmit=async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;el('loginMsg').textContent='';try{await api('POST',{action:'login',user:el('user').value,password:el('pass').value});el('pass').value='';await reload()}catch(e){report(e)}finally{btn.disabled=false}};
el('logout').onclick=async()=>{try{await api('POST',{action:'logout'});showLogin();el('filter').value='';el('notice').textContent='';el('user').value=''}catch(e){report(e)}};
el('refresh').onclick=()=>reload().catch(report);
function refreshVisible(){if(name && !document.hidden)reload().catch(report)}
window.addEventListener('focus',refreshVisible);
document.addEventListener('visibilitychange',refreshVisible);
setInterval(refreshVisible,60000);
function node(tag,cls,txt){const n=document.createElement(tag);n.className=cls;n.textContent=txt;return n}
// Feriados nacionales recurrentes del Perú: https://www.gob.pe/feriados
function nationalHolidays(year){
  const fixed = {
    '01-01':'Año Nuevo', '05-01':'Día del Trabajo',
    '06-07':'Batalla de Arica y Día de la Bandera', '06-29':'San Pedro y San Pablo',
    '07-23':'Día de la Fuerza Aérea del Perú', '07-28':'Fiestas Patrias', '07-29':'Fiestas Patrias',
    '08-06':'Batalla de Junín', '08-30':'Santa Rosa de Lima',
    '10-08':'Combate de Angamos', '11-01':'Día de Todos los Santos',
    '12-08':'Inmaculada Concepción', '12-09':'Batalla de Ayacucho', '12-25':'Navidad'
  };
  const holidays=new Map(Object.entries(fixed).map(([md,label])=>[year+'-'+md,label]));
  // Fecha gregoriana de Pascua (Meeus/Jones/Butcher).
  const floor=Math.floor, a=year%19, century=floor(year/100), y=year%100;
  const correction=floor((century-floor((century+8)/25)+1)/3);
  const h=(19*a+century-floor(century/4)-correction+15)%30;
  const l=(32+2*(century%4)+2*floor(y/4)-h-y%4)%7;
  const n=h+l-7*floor((a+11*h+22*l)/451)+114;
  const month=floor(n/31)-1, easterDay=n%31+1;
  for(const [offset,label] of [[3,'Jueves Santo'],[2,'Viernes Santo']]){
    const date=new Date(year,month,easterDay-offset,12);
    const k=key(date);
    holidays.set(k,holidays.has(k)?holidays.get(k)+' · '+label:label);
  }
  return holidays;
}
function renderUpcoming(visible){
  const today=limaDay();
  const upcoming=visible.filter(r=>r.date>=today && r.status==='En proceso')
    .sort((a,b)=>a.date.localeCompare(b.date)||a.title.localeCompare(b.title,'es'));
  el('upCount').textContent=upcoming.length ? upcoming.length+' por atender' : 'Sin actividades pendientes desde hoy.';
  const list=el('upList');list.replaceChildren();
  for(const r of upcoming){
    const button=node('button','','');
    const dateLabel=fmt(parse(r.date),{day:'numeric',month:'short',year:'numeric'});
    button.append(node('small','',(r.date===today?'Hoy · ':'')+dateLabel),node('strong','',r.title),node('small','',r.person));
    button.onclick=()=>{selected=r.date;render();const entry=el('activity-'+r.id);if(entry){entry.focus({preventScroll:true});entry.scrollIntoView({block:'center'})}};
    list.append(button);
  }
}
function visibilityLabel(r){
  if(r.shared)return 'Compartida con el equipo';
  return r.person==='Renzo Salas'?'Privada · solo Renzo':'Renzo y responsable';
}
function render(){
const admin=name==='Renzo Salas',person=el('filter').value,d=parse(selected);

el('subtitle').textContent=admin?'Tus actividades y las de tu equipo.':'Tus actividades y las que Renzo comparte con el equipo.';
const visible=records.filter(r=>!person||person===r.person),rows=visible.filter(r=>r.date===selected).sort((a,b)=>a.time.localeCompare(b.time));
renderUpcoming(visible);
el('total').textContent=rows.length;el('done').textContent=rows.filter(r=>r.status==='Completada').length;el('pending').textContent=rows.length-Number(el('done').textContent);
el('month').textContent=fmt(d,{month:'long',year:'numeric'});el('day').textContent=fmt(d,{weekday:'long',day:'numeric',month:'long'});
const holidays=nationalHolidays(d.getFullYear());
el('holiday').textContent=holidays.get(selected)||'';el('holiday').hidden=!holidays.has(selected);
const cal=el('calendar');cal.replaceChildren();for(const t of ['Lu','Ma','Mi','Ju','Vi','Sá','Do'])cal.append(node('small',t==='Do'?'red-day':'',t));
const first=new Date(d.getFullYear(),d.getMonth(),1);for(let i=0;i<(first.getDay()+6)%7;i++)cal.append(node('span','',''));
for(let i=1;i<=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();i++){const date=new Date(d.getFullYear(),d.getMonth(),i),k=key(date),b=node('button',k===selected?'selected':'',i);const holiday=holidays.get(k);
if(date.getDay()===0||holiday)b.classList.add('red-day');
b.title=fmt(date,{weekday:'long',day:'numeric',month:'long'})+(holiday?' · '+holiday:'');
b.setAttribute('aria-label',b.title);
if(visible.some(r=>r.date===k))b.classList.add('dot');b.setAttribute('aria-pressed',k===selected);b.onclick=()=>{selected=k;render()};cal.append(b)}
const list=el('list');list.replaceChildren();if(!rows.length)list.append(node('p','empty','Aún no hay actividades registradas para esta selección.'));
for(const r of rows){const a=node('article','entry',''),body=node('div','',''),meta=node('div','meta','');a.id='activity-'+r.id;a.tabIndex=-1;a.append(node('span','time',r.time),body);meta.append(node('span','',r.person),node('span','badge '+(r.status==='En proceso'?'pending':''),r.status));if(admin){
const eye=node('button','edit share-eye',visibilityLabel(r));
eye.setAttribute('aria-pressed',String(r.shared===true));
eye.title=r.shared?'Restringir visibilidad':'Compartir con Fernando y Maricielo';
eye.onclick=async()=>{eye.disabled=true;try{await api('PATCH',{...r,shared:!r.shared});await reload()}catch(e){report(e)}finally{eye.disabled=false}};
meta.append(eye);
const b=node('button','edit','Modificar');b.onclick=()=>openForm(r);meta.append(b);const del=node('button','edit','Eliminar');del.onclick=async()=>{if(!confirm('¿Eliminar esta actividad de '+r.person+'?'))return;try{await api('DELETE',{id:r.id,rev:r.rev});await reload()}catch(e){report(e)}};meta.append(del)}else if(r.shared){meta.append(node('span','badge','Compartida'))}body.append(meta,node('h3','',r.title),node('p','muted',r.detail));if(r.changed)body.append(node('small','','Modificado por Renzo · '+new Date(r.changed).toLocaleString('es-PE')));list.append(a)}
}
function updateVisibilityLabel(){el('share').options[0].textContent=el('person').value==='Renzo Salas'?'Privada · solo Renzo':'Renzo y el responsable'}
el('person').onchange=updateVisibilityLabel;
function openForm(r){const admin=name==='Renzo Salas';if(r&&!admin)return;editing=r?.id??null;revision=r?.rev??null;el('heading').textContent=r?'Modificar actividad':'Registrar actividad';el('person').disabled=!admin;el('person').value=r?.person||(admin?(el('filter').value||name):name);el('shareLabel').hidden=!admin;el('share').value=r?.shared?'team':'restricted';updateVisibilityLabel();el('dateInput').value=r?.date||selected;el('titleInput').value=r?.title||'';el('detail').value=r?.detail||'';el('statusInput').value=r?.status||'En proceso';el('hint').textContent=admin?'Renzo puede corregir los registros del equipo.':'Una vez guardada, solo Renzo podrá modificar esta actividad.';el('modal').showModal()}
el('form').onsubmit=async e=>{e.preventDefault();const admin=name==='Renzo Salas';if(editing!==null&&!admin)return;const now=new Date(),title=el('titleInput').value.trim(),detail=el('detail').value.trim();if(!title||!detail){alert('Completa la actividad y el detalle del avance.');return}
const data={shared:admin&&el('share').value==='team',person:admin?el('person').value:name,date:el('dateInput').value,title,detail,status:el('statusInput').value};
const btn=e.submitter;btn.disabled=true;
try{await api(editing===null?'POST':'PATCH',{...data,id:editing,rev:revision});el('modal').close();selected=data.date;if(admin&&el('filter').value)el('filter').value=data.person;el('notice').textContent='Actividad guardada.';await reload()}catch(e){alert(e.message)}finally{btn.disabled=false}};
el('cancel').onclick=()=>el('modal').close();el('add').onclick=()=>openForm();el('filter').onchange=render;el('today').onclick=()=>{selected=limaDay();render()};function move(delta){const d=parse(selected);selected=key(new Date(d.getFullYear(),d.getMonth()+delta,1));render()}el('prev').onclick=()=>move(-1);el('next').onclick=()=>move(1);reload().catch(e=>{if(e.message!=='Ingresa con tu cuenta.')report(e)});
</script></html>
